<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共享会话 · agent_room</title><link rel="stylesheet" href="style.css"><script src="app.js" type="module"></script></head>
<body><aside class="sidebar"><div class="side-brand"><span class="mark">a</span> agent_room</div><section><h2>HOST</h2><code id="host-address">连接中</code></section><section><h2>SESSION ID</h2><code id="session-id"></code><button id="copy-session" type="button">复制 session_id</button></section><section><h2>会话成员 <span id="member-count"></span></h2><nav id="member-list" aria-label="按成员筛选"></nav></section><div class="identity">当前发送身份<br><strong id="viewer-name"></strong></div></aside><div class="workspace"><header><div class="brand"><span class="mark">a</span><span>agent_room <small>共享会话</small></span></div><div class="status" id="status" role="status">正在连接</div></header>
<main><div id="filter-label" role="status">全部成员的对话</div><div class="intro"><span class="eyebrow">SHARED SESSION</span><h1>一起提问，<br>一起把工作推进。</h1><p>这里同步所有成员的发言与模型回答。也可以直接在下方提问。</p></div><div id="notice" hidden>为保持流畅，仅显示最近的消息。完整历史保留在 host。</div><section id="answers" aria-live="polite" aria-label="共享聊天记录"></section><div id="empty"><span class="pulse"></span>等待第一条消息</div></main><div class="composer-wrap"><form id="composer"><label for="message">提问或安排工作</label><textarea id="message" rows="3" placeholder="输入问题或工作要求…（Enter 发送，Alt+Enter 换行）" maxlength="60000" required></textarea><div class="composer-actions"><span id="send-status" role="status">使用当前已批准身份发送 · 与终端共享任务队列</span><button id="send" type="submit" disabled>发送</button></div></form></div><footer>所有成员共享此会话 · 关闭页面不会取消已提交的任务</footer></div></body></html>
